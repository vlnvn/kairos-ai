name: Release quality

on:
  pull_request:
  push:
    branches:
      - develop
      - main
      - feature/adriel-backend-api
      - feature/daniel-frontend-interaction
      - chore/eze-platform-integration-qa

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned runtime
        run: python -m pip install .
      - name: Run contract tests
        run: python -m unittest discover -s tests -v
      - name: Verify frozen AI release
        run: python scripts/verify_ai_release.py
      - name: Verify full-stack release
        run: python scripts/verify_fullstack_release.py
      - name: Compile Python sources
        run: python -m compileall -q src scripts tests
      - name: Parse tracked JSON
        run: python -c "import json, pathlib; [json.loads(path.read_text(encoding='utf-8')) for path in pathlib.Path('.').rglob('*.json') if '.git' not in path.parts]"
      - name: Build local-demo image
        run: docker build --tag kairos:ci .
