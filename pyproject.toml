[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kairos-ai"
version = "1.0.0"
description = "Capacity-constrained prospective pickup-window compliance triage"
requires-python = ">=3.11"
dependencies = ["catboost==1.2.10", "numpy==2.3.5", "pandas==3.0.1"]

[project.scripts]
kairos = "kairos_ai.cli:main"
kairos-server = "kairos_ai.server:main"

[tool.setuptools.packages.find]
where = ["src"]

